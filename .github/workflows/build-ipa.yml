name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA (for SideStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          rm -rf ios/web && cp -R dist ios/web

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project ios/FlagQuest.xcodeproj \
            -scheme FlagQuest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/FlagQuest.app Payload/
          zip -qry FlagQuest.ipa Payload
          ls -lh FlagQuest.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlagQuest-ipa
          path: FlagQuest.ipa

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlagQuest.ipa \
            --title "FlagQuest (build ${{ github.run_number }})" \
            --notes "Unsigned build of ${{ github.sha }}. Download FlagQuest.ipa on your iPhone and open it with SideStore." \
            --latest

  simulator:
    name: Simulator smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          rm -rf ios/web && cp -R dist ios/web

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project ios/FlagQuest.xcodeproj \
            -scheme FlagQuest \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch app and take a screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')))
          ")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/FlagQuest.app
          xcrun simctl launch "$DEVICE" app.flagquest.ios
          sleep 20
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/home.png

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshots/
